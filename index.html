<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxe Hotel Booking</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        h2 { text-align: center; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--hint-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
        }
        .total-box {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<h2>🏨 Grand Luxe Booking</h2>

<form id="bookingForm">
    <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+1234567890" required>
    </div>

    <div class="form-group">
        <label for="roomType">Room Type</label>
        <select id="roomType" onchange="calculateTotal()">
            <option value="Standard Room" data-price="50">Standard Room ($50/night)</option>
            <option value="Deluxe Suite" data-price="100">Deluxe Suite ($100/night)</option>
            <option value="Presidential Suite" data-price="250">Presidential Suite ($250/night)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="checkIn">Check-In Date</label>
        <input type="date" id="checkIn" required>
    </div>

    <div class="form-group">
        <label for="nights">Nights</label>
        <input type="number" id="nights" value="1" min="1" max="30" onchange="calculateTotal()" required>
    </div>

    <div class="total-box" id="totalDisplay">Total: $50</div>
</form>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Expand Mini App to full height

    function calculateTotal() {
        const roomSelect = document.getElementById('roomType');
        const pricePerNight = parseInt(roomSelect.options[roomSelect.selectedIndex].getAttribute('data-price'));
        const nights = parseInt(document.getElementById('nights').value) || 1;
        const total = pricePerNight * nights;
        document.getElementById('totalDisplay').innerText = `Total: $${total}`;
        return total;
    }

    // Set min date for check-in to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('checkIn').min = today;
    document.getElementById('checkIn').value = today;

    // Configure Telegram Main Button
    tg.MainButton.text = "Confirm & Book";
    tg.MainButton.color = "#2481cc";
    tg.MainButton.show();

    // Handle Main Button click
    Telegram.WebApp.onEvent('mainButtonClicked', function() {
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const roomSelect = document.getElementById('roomType');
        const roomType = roomSelect.value;
        const checkIn = document.getElementById('checkIn').value;
        const nights = document.getElementById('nights').value;
        const total_price = calculateTotal();

        if (!fullName || !phone || !checkIn) {
            alert('Please fill out all required fields.');
            return;
        }

        // Package data to send back to the Telegram Bot
        const data = {
            full_name: fullName,
            phone: phone,
            room_type: roomType,
            check_in: checkIn,
            nights: nights,
            total_price: total_price
        };

        // Send data to bot and close mini app
        tg.sendData(JSON.stringify(data));
    });

    calculateTotal();
</script>
</body>
</html>
