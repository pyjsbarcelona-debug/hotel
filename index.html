<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxe Hotel Analytics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 5px 0;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(15, 23, 42, 0.9);
        }

        /* Room Selection Cards */
        .room-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .room-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .room-card.active {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .room-name {
            font-weight: 700;
            font-size: 15px;
        }

        .room-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .room-price {
            font-weight: 800;
            color: var(--primary);
            font-size: 16px;
        }

        /* Analytical Summary Box */
        .analytics-box {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(129, 140, 248, 0.05));
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 16px;
            padding: 18px;
            margin-top: 25px;
        }

        .analytics-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .analytics-row.total {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .analytics-row.total span:last-child {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Grand Luxe Hotel</h1>
            <p>Premium & Analytical Booking System</p>
        </div>

        <div class="glass-card">
            <div class="form-group">
                <label>Xona toifasini tanlang</label>
                <div class="room-grid">
                    <div class="room-card active" onclick="setRoom('Standard Room', 50, this)">
                        <div>
                            <div class="room-name">Standard Room</div>
                            <div class="room-desc">Qulay va shinam</div>
                        </div>
                        <div class="room-price">$50</div>
                    </div>
                    <div class="room-card" onclick="setRoom('Deluxe Suite', 100, this)">
                        <div>
                            <div class="room-name">Deluxe Suite</div>
                            <div class="room-desc">Manzarali va keng</div>
                        </div>
                        <div class="room-price">$100</div>
                    </div>
                    <div class="room-card" onclick="setRoom('Presidential Suite', 250, this)">
                        <div>
                            <div class="room-name">Presidential Suite</div>
                            <div class="room-desc">Oliy darajadagi lyuks</div>
                        </div>
                        <div class="room-price">$250</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="fullName">To'liq ism-sharif</label>
                <input type="text" id="fullName" placeholder="Ism Familiya" required>
            </div>

            <div class="form-group">
                <label for="phone">Telefon raqam</label>
                <input type="tel" id="phone" placeholder="+998 90 123 45 67" required>
            </div>

            <div class="form-group">
                <label for="checkIn">Kelish sanasi</label>
                <input type="date" id="checkIn" required>
            </div>

            <div class="form-group">
                <label for="nights">Kechalar soni</label>
                <input type="number" id="nights" value="1" min="1" max="30" oninput="updateAnalytics()" required>
            </div>

            <div class="analytics-box">
                <div class="analytics-row">
                    <span>Tanlangan xona:</span>
                    <span id="summaryRoom" style="color: var(--text-main); font-weight: 600;">Standard Room</span>
                </div>
                <div class="analytics-row">
                    <span>Bir kecha narxi:</span>
                    <span id="summaryNightPrice">$50</span>
                </div>
                <div class="analytics-row total">
                    <span>Jami to'lov:</span>
                    <span id="totalDisplay">$50</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentRoom = "Standard Room";
        let currentPrice = 50;

        function setRoom(name, price, element) {
            document.querySelectorAll('.room-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentRoom = name;
            currentPrice = price;
            document.getElementById('summaryRoom').innerText = name;
            document.getElementById('summaryNightPrice').innerText = `$${price}`;
            updateAnalytics();
        }

        function updateAnalytics() {
            const nights = parseInt(document.getElementById('nights').value) || 1;
            const total = currentPrice * nights;
            document.getElementById('totalDisplay').innerText = `$${total}`;
            return total;
        }

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('checkIn').min = today;
        document.getElementById('checkIn').value = today;

        tg.MainButton.text = "Band qilishni yakunlash 🚀";
        tg.MainButton.color = "#0ea5e9";
        tg.MainButton.show();

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const checkIn = document.getElementById('checkIn').value;
            const nights = document.getElementById('nights').value;
            const total_price = updateAnalytics();

            if (!fullName || !phone || !checkIn) {
                alert('Iltimos, barcha maydonlarni toʻldiring!');
                return;
            }

            const payload = {
                full_name: fullName,
                phone: phone,
                room_type: currentRoom,
                check_in: checkIn,
                nights: nights,
                total_price: total_price
            };

            tg.sendData(JSON.stringify(payload));
        });

        updateAnalytics();
    </script>
</body>
</html>
